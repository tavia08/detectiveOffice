<head>

<title>역사 탐정사무소 v5.0.4</title>
<style>
:root{
  --ink:#2f251f; --paper:#fff8e9; --paper2:#ead5b2;
  --wood:#65412c; --red:#93463c; --green:#4b6655;
  --gold:#c49549; --line:#b8946c; --shadow:rgba(28,17,10,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 50% -20%,rgba(255,232,190,.20),transparent 45%),
    linear-gradient(180deg,#3b2a20,#5b3c2b 45%,#3d2a20);
}
button{font:inherit}
.app{max-width:1480px;margin:auto;padding:14px 16px 42px}

.topbar{
  position:sticky;top:8px;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;border-radius:17px;
  background:rgba(255,247,231,.96);border:1px solid #b99570;
  box-shadow:0 9px 26px rgba(0,0,0,.24);backdrop-filter:blur(9px)
}
.brand{display:flex;align-items:center;gap:11px}
.seal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#463126;color:#fff;border:4px double #d4b16e;font-weight:950;font-size:21px}
.brand-title{font-size:19px;font-weight:950} .small{font-size:12px;color:#75675a}
.stats{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{background:#ead9bd;border:1px solid #c2a17c;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}
.top-btn{border:1px solid #b89570;background:#fff9ed;border-radius:999px;padding:8px 11px;font-weight:900;cursor:pointer;color:#4e3628}

.office-frame{
  margin-top:16px;position:relative;width:100%;aspect-ratio:2048/1143;
  border:1px solid #8e684a;border-radius:22px;overflow:hidden;
  box-shadow:0 18px 45px rgba(0,0,0,.34);background:#6a4a36
}
.office-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none}

.office-title{
  position:absolute;left:2.2%;top:2.8%;z-index:4;
  padding:10px 14px;border-radius:8px;
  background:rgba(52,36,28,.87);color:#f4e0b7;
  border:2px solid rgba(221,190,128,.88);
  box-shadow:0 5px 13px rgba(0,0,0,.22)
}
.office-title b{display:block;font-size:clamp(14px,1.55vw,23px)} .office-title span{font-size:clamp(8px,.72vw,11px);letter-spacing:.11em;color:#d9c6a7}

.hotspot{
  position:absolute;z-index:5;border:2px solid transparent;background:transparent;border-radius:12px;cursor:pointer;
  transition:.15s;outline:none
}
.hotspot:hover,.hotspot:focus-visible{
  border-color:rgba(255,215,120,.95);
  background:rgba(255,218,124,.11);
  box-shadow:0 0 0 3px rgba(91,58,30,.18),0 0 25px rgba(255,209,103,.52)
}
.hotspot .tag{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  white-space:nowrap;background:rgba(255,247,226,.94);border:1px solid #9a744c;border-radius:999px;
  padding:5px 8px;font-size:clamp(8px,.74vw,12px);font-weight:950;color:#523a29;
  box-shadow:0 3px 8px rgba(0,0,0,.18);transition:.15s
}
.hotspot:hover .tag{transform:translate(-50%,-50%) scale(1.06)}
.hotspot .done-stamp{
  display:none;position:absolute;right:-3px;top:-4px;transform:rotate(10deg);
  width:43px;height:43px;border:2px solid #94463d;color:#94463d;border-radius:50%;
  background:rgba(255,244,223,.88);place-items:center;text-align:center;
  font-size:9px;line-height:1;font-weight:950
}
.hotspot.done .done-stamp{display:grid}

.folder-1{left:25.8%;top:66.6%;width:17.0%;height:10.5%}
.folder-2{left:36.0%;top:61.8%;width:12.2%;height:8.5%}
.folder-3{left:44.1%;top:61.1%;width:12.2%;height:8.6%}
.folder-4{left:52.3%;top:62.0%;width:12.1%;height:8.4%}
.folder-5{left:37.0%;top:69.0%;width:14.4%;height:8.8%}
.folder-6{left:47.5%;top:71.4%;width:14.5%;height:9.1%}

.notebook-hot{left:68.3%;top:75.0%;width:14.8%;height:13.0%}
.phone-hot{left:68.1%;top:59.0%;width:10.5%;height:13.0%}
.board-hot{left:48.8%;top:18.5%;width:34.0%;height:41.5%}

.special .tag{background:rgba(61,48,39,.89);color:#fff3d9;border-color:#c19b64}
.board-hot .tag{top:9%;left:14%;transform:none}
.board-hot:hover .tag{transform:scale(1.04)}

.board-progress{
  position:absolute;z-index:4;
  /* 뒤 게시판의 오른쪽 지도 영역 안에 자연스럽게 들어오도록 크기 재조정 */
  left:70.9%;top:24.1%;width:11.1%;height:25.8%;
  background:
    linear-gradient(rgba(255,248,226,.99),rgba(247,229,194,.99)),
    repeating-linear-gradient(0deg,rgba(126,91,53,.018) 0 1px,transparent 1px 5px);
  border:2px solid rgba(126,91,53,.78);
  border-radius:7px;
  padding:9px 9px 9px;
  box-shadow:0 4px 12px rgba(0,0,0,.16), inset 0 0 0 1px rgba(255,255,255,.55);
  transform:rotate(-0.15deg);
  pointer-events:none;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:center;
  text-align:center;
}
.board-progress::before,.board-progress::after{
  content:"";position:absolute;width:7px;height:7px;border-radius:50%;
  background:#8d5b35;box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.28);top:6px
}
.board-progress::before{left:7px}.board-progress::after{right:7px}
.board-progress b{
  display:inline-block;font-size:clamp(8px,.72vw,11px);line-height:1.15;margin:1px 0 8px;
  padding:4px 7px;border-radius:999px;background:#5a3d2d;color:#fff4dc;
  box-shadow:0 2px 5px rgba(0,0,0,.13)
}
.board-progress .count-large{
  font-size:clamp(17px,1.42vw,23px);font-weight:950;color:#4e3b2c;line-height:1;margin-bottom:6px
}
.board-progress .bar{
  width:86%;height:6px;background:#d8c4a7;border-radius:999px;overflow:hidden;margin:1px 0 6px
}
.board-progress .fill{
  height:100%;width:0;background:#a96d2c;border-radius:999px;transition:.3s
}
.board-progress span{
  font-size:clamp(6px,.55vw,8.5px);color:#625447;line-height:1.25
}

.board-message{
  width:90%;margin-top:auto;padding:7px 2px 0;
  border-top:1px solid rgba(126,91,53,.42);
  color:#4f392b;font-size:clamp(7px,.63vw,10px);line-height:1.25;font-weight:950
}

.hint{
  margin:10px auto 0;width:max-content;max-width:100%;padding:8px 12px;border-radius:999px;
  background:rgba(255,244,224,.9);border:1px solid #b48d66;color:#5d4737;font-size:12px;font-weight:850
}

.page{display:none;margin-top:16px} .page.show{display:block}
.paper-page{background:#f7ead5;border:1px solid #ad8c68;border-radius:20px;padding:20px;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.page-head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:2px dashed #c3a681;padding-bottom:13px}
.page-head h2{margin:0;font-size:25px} .back{border:1px solid #b89b78;background:#fff8e9;border-radius:9px;padding:8px 11px;font-weight:900;cursor:pointer}

.case-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.case-file{
  border:1px solid #c0a17b;background:#fff9ec;border-radius:12px;padding:14px;
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  cursor:pointer;text-align:left;box-shadow:0 5px 12px rgba(75,49,30,.08)
}
.case-file:hover{transform:translateY(-2px);border-color:#9a754e}
.case-no{font-size:11px;font-weight:950;color:#6e4933;background:#ead6b7;border:1px solid #c2a17d;border-radius:8px;padding:7px}
.case-title{font-weight:900;line-height:1.4}
.case-state{font-size:11px;font-weight:950;border-radius:999px;padding:6px 8px;background:#e7dbc9;color:#76695e}
.case-file.solved{border-color:#94a78f;background:#fbf8ec} .case-file.solved .case-state{background:#dfe9da;color:#3d5b3e}

.notebook-page{background:linear-gradient(90deg,#ead0a6 0 14px,transparent 14px),#fff8e8}
.stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}
.record{border:1px dashed #c4a47b;border-radius:12px;padding:11px;min-height:110px;background:#fbf2e4;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.record.got{border-style:solid;background:#f2e7d3} .record .mark{font-size:11px;font-weight:950;color:#8e473e}
.stamp-img-wrap{display:flex;align-items:center;justify-content:center;min-height:84px;margin:6px 0 8px}
.stamp-img{width:80px;height:80px;object-fit:contain;opacity:.20;filter:grayscale(1);transition:.18s}
.record.got .stamp-img{opacity:1;filter:none;transform:rotate(-2deg)}
.record .stamp-caption{font-size:10px;font-weight:900;color:#7d6d5f;text-align:center;margin-top:4px}
.record.got .stamp-caption{color:#8e473e}


.modal{display:none;position:fixed;inset:0;z-index:900;background:rgba(31,23,18,.58);padding:20px;place-items:center}
.modal.show{display:grid}
.modal-card{width:min(760px,94vw);max-height:84vh;overflow:auto;background:#fff7e8;border:1px solid #aa8862;border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}
.modal-head h2{margin:0} .close{border:1px solid #bea07b;background:#f2e2c8;border-radius:9px;padding:7px 10px;font-weight:900;cursor:pointer}
.overview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.overview-item{border:1px solid #c6a984;border-radius:12px;padding:12px;background:#fffaf0}
.overview-item b{display:block;margin-bottom:5px} .mini-bar{height:7px;background:#e0cfb8;border-radius:999px;overflow:hidden} .mini-fill{height:100%;background:#668069;border-radius:999px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:1200;background:#352820;color:#fff4df;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:13px;font-weight:850}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.viewer{display:none;position:fixed;inset:0;background:#201915;z-index:1000;height:100vh;height:100dvh;overflow:hidden} .viewer.show{display:block}
.viewerbar{height:58px;background:#f4e6ce;border-bottom:1px solid #b4926a;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:10px}
.viewer-left{display:flex;align-items:center;gap:10px;min-width:0} .viewer-title{font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbtn{border:1px solid #bea07d;background:#fff9ed;border-radius:9px;padding:8px 10px;font-weight:900;cursor:pointer;white-space:nowrap}
.viewer iframe{width:100%;height:calc(100vh - 58px);height:calc(100dvh - 58px);border:0;background:#fff;display:block;overflow:auto;-webkit-overflow-scrolling:touch}
.footer{text-align:center;color:#d7c4ae;font-size:12px;margin-top:16px}

@media(max-width:900px){
  .case-grid{grid-template-columns:1fr} .stamp-grid{grid-template-columns:repeat(3,1fr)}
  .board-progress{left:70.6%;top:23.7%;width:11.4%;height:26.4%;padding:8px 7px 8px}
}
@media(max-width:650px){
  .app{padding-left:8px;padding-right:8px} .topbar{align-items:flex-start}
  .stats .hide-sm{display:none} .office-title{padding:6px 8px}
  .hotspot .tag{padding:3px 5px;font-size:7px}
  .board-progress{padding:5px 5px 6px} .board-progress .bar{height:4px} .board-progress b{margin:0 0 5px;padding:3px 5px} .board-progress .count-large{margin-bottom:4px} .board-message{padding-top:5px;font-size:clamp(6px,.62vw,8.5px)}
  .stamp-grid{grid-template-columns:repeat(2,1fr)}
  .case-file{grid-template-columns:auto 1fr} .case-state{grid-column:2}
}

/* v4.0 transparent stamp polish */
.stamp-img-wrap{min-height:104px!important;margin:5px 0 8px!important}
.stamp-img{
  width:98px!important;height:98px!important;object-fit:contain!important;
  background:transparent!important;border:0!important;
  opacity:.17!important;filter:grayscale(1)!important;
}
.record.got .stamp-img{
  opacity:1!important;filter:none!important;
  transform:rotate(-2deg) scale(1.02)!important;
}

</style>

function solved(c){
  try{return localStorage.getItem(c.solveKey)==="true"}catch(e){return false}
}
function stamped(c){
  if(!c.stampKey) return solved(c);
  try{return localStorage.getItem(c.stampKey)==="true"}catch(e){return solved(c)}
}
function countSolved(list=CASES){return list.filter(solved).length}

function toast(msg){

}

function updateViewerBackLabel(){
  const btn=document.getElementById("viewerBackBtn");
  if(!btn) return;
  if(document.getElementById("unitPage").classList.contains("show") && currentUnit){
    btn.textContent="← 단원 사건 목록";
  }else if(document.getElementById("notebookPage").classList.contains("show")){

  }
}

window.historyDetectiveNavigate={
  home(){ closeCase(); showHome(); },
  notebook(){ closeCase(); showNotebook(); },
  unitByCode(code){
    const c=CASES.find(x=>x.code===code);
    closeCase();
    if(c) openUnit(c.unit); else showHome();
  }
};

function updateProgress(){
  const n=countSolved(), pct=Math.round(n/CASES.length*1000)/10;
  document.getElementById("solvedTop").textContent=n;
  document.getElementById("percentTop").textContent=pct;
  document.getElementById("boardCount").textContent=`${n} / 44`;
  document.getElementById("boardText").textContent=`사건 해결 · ${pct}%`;
  document.getElementById("boardFill").style.width=pct+"%";

  for(let u=1;u<=6;u++){
    const list=CASES.filter(c=>c.unit===u), done=countSolved(list);
    document.getElementById(`u${u}count`).textContent=`${done}/${list.length}`;
    const h=document.getElementById(`unitHot${u}`);
    h.classList.toggle("done",done===list.length);
  }
}

function showHome(){
  document.getElementById("home").style.display="";
  document.getElementById("unitPage").classList.remove("show");
  document.getElementById("notebookPage").classList.remove("show");
  updateProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

  document.getElementById("unitTitle").textContent=meta.name;

  const grid=document.getElementById("caseGrid"); grid.innerHTML="";
  list.forEach(c=>{
    const b=document.createElement("button");
    b.className="case-file"+(solved(c)?" solved":"");
    b.onclick=()=>openCase(c.code);
    b.innerHTML=`<div class="case-no">CASE ${c.code}</div>
      <div class="case-title">${c.title}</div>
      <div class="case-state">${solved(c)?"✓ 해결 완료":"미해결 사건"}</div>`;
    grid.appendChild(b);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function showNotebook(){
  document.getElementById("home").style.display="none";
  document.getElementById("unitPage").classList.remove("show");
  document.getElementById("notebookPage").classList.add("show");

  const grid=document.getElementById("stampGrid");grid.innerHTML="";
  CASES.forEach(c=>{
    const got=stamped(c),div=document.createElement("div");
    div.className="record"+(got?" got":"");
    div.onclick=()=>openCase(c.code);
    div.innerHTML=`<div class="mark">${got?"◉ 스탬프 획득":"○ 미해결"}</div>
      <div class="stamp-img-wrap"><img class="stamp-img" src="${STAMP_IMAGES[c.code]||""}" alt="CASE ${c.code} 스탬프"></div>
      <div><div class="small">CASE ${c.code}</div>
      <div style="font-weight:900;line-height:1.35">${c.title}</div>
      <div class="stamp-caption">${got?"수사 완료 스탬프":"사건 해결 후 획득"}</div></div>`;
    grid.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function showOverview(){
  const grid=document.getElementById("overviewGrid");grid.innerHTML="";
  for(let u=1;u<=6;u++){
    const meta=UNITS[u],list=CASES.filter(c=>c.unit===u),done=countSolved(list),pct=Math.round(done/list.length*100);
    const div=document.createElement("div");
    div.className="overview-item";
    div.innerHTML=`<b>${meta.roman}단원 · ${meta.name}</b>
      <div class="small" style="margin-bottom:6px">${done} / ${list.length} 사건 해결</div>
      <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>`;
    div.onclick=()=>{hideOverview();openUnit(u)};
    div.style.cursor="pointer";
    grid.appendChild(div);
  }
  document.getElementById("overviewModal").classList.add("show");
}
function hideOverview(){document.getElementById("overviewModal").classList.remove("show")}

function decodeBase64Utf8(b64){
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

.removeAttribute('aria-disabled');\n            q.style.pointerEvents = 'auto';\n            q.style.opacity = '1';\n            q.style.cursor = 'pointer';\n          }\n        }\n        enableInterpretationButton();\n        setTimeout(enableInterpretationButton, 0);\n        setTimeout(enableInterpretationButton, 120);\n      }\n    }\n    window.closeModal();\n  }\n\n  window.closeModal = function(){\n    clearPacingTimer();\n    pacingPendingClue = null;\n    pacingPendingBtn = null;\n    if(originalCloseModal) return originalCloseModal();\n    const modal = getEl('clueModal');\n    if(modal){ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); }\n  };\n\n  window.showClue = function(n, btn){\n    const d = clueData[n];\n    if(!d) return;\n    const modal = getEl('clueModal');\n    const icon = getEl('modalIcon'), code = getEl('modalCode'), title = getEl('modalTitle');\n    const desc = getEl('modalDesc'), points = getEl('modalPoints');\n    if(icon) icon.textContent = d.icon || '';\n    if(code) code.textContent = d.code || '';\n    if(title) title.textContent = d.title || '';\n    if(desc) desc.textContent = d.desc || '';\n    if(points) points.innerHTML = (d.points || []).map(function(p){ return '<li>' + p + '</li>'; }).join('');\n    if(modal){ modal.classList.add('show'); modal.setAttribute('aria-hidden','false'); }\n\n    clearPacingTimer();\n    pacingPendingClue = n;\n    pacingPendingBtn = btn;\n\n    if(found.has(n)){\n      setAction('이미 확인한 단서 · 닫기', false, window.closeModal);\n      return;\n    }\n\n    pacingSeconds = 4;\n    setAction('단서 읽는 중 · 4초', true, null);\n    pacingTimer = setInterval(function(){\n      pacingSeconds -= 1;\n      if(pacingSeconds > 0){\n        setAction('단서 읽는 중 · ' + pacingSeconds + '초', true, null);\n      } else {\n        clearPacingTimer();\n        setAction('✓ 단서 확인 완료', false, markClueConfirmed);\n      }\n    }, 1000);\n  };\n\n  function lockQuestion(box, ms, permanent){\n    if(!box) function patchCaseForPacing(caseHtml, code){
  const scriptClose = '</scr' + 'ipt>';
  let guard = '';
  if(!caseHtml.includes('data-pacing-guard="v4.2"')){
    const style = '<style data-pacing-guard="v4.2">#clueModal .btn:disabled{opacity:.52;cursor:wait} .option{transition:opacity .15s ease}</style>';
    const scriptOpen = '<script data-pacing-guard="v4.2">';
    guard += style + scriptOpen + PACING_GUARD_JS + scriptClose;
  }
  if(!caseHtml.includes('data-navigation-guard="v5.0.1"')){
    const navOpen = '<script data-navigation-guard="v5.0.1">';
    const navCode = NAVIGATION_GUARD_JS.replace('__CASE_CODE__', code);
    guard += navOpen + navCode + scriptClose;
  }
  if(!caseHtml.includes('data-tablet-scroll-guard="v5.0.2"')){
    const scrollOpen = '<script data-tablet-scroll-guard="v5.0.2">';
    guard += TABLET_SCROLL_GUARD_CSS + scrollOpen + TABLET_SCROLL_GUARD_JS + scriptClose;
  }
  if(!guard) return caseHtml;
  return caseHtml.includes('</body>') ? caseHtml.replace('</body>', guard + '</body>') : caseHtml + guard;
}

function cleanOptionText(s){ return s.replace(/^[①②③]\s*/,'').replace(/\s+/g,' ').trim(); }
function rebalanceCaseHtml(code, html){
  const target = ANSWER_TARGETS[code] || {};
  const circ = {1:'①',2:'②',3:'③'};
  const fns = ['checkQ1','checkQ2','checkFinal'];
  function currentCorrect(src,fn){
    const re = new RegExp(String.raw`function\s+${fn}\(el,\s*n\)\{[\s\S]*?if\(n===([123])\)`);
    const m = src.match(re); return m ? Number(m[1]) : null;
  }
  function replaceCorrect(src,fn,n){
    const re = new RegExp(String.raw`(function\s+${fn}\(el,\s*n\)\{[\s\S]*?if\(n===)([123])(\))`);
    return src.replace(re,'$1'+n+'$3');
  }
  for(const fn of fns){
    const desired = target[fn];
    if(!desired) continue;
    const cur = currentCorrect(html, fn);
    if(cur==null || cur===desired) continue;
    const blockRe = new RegExp(String.raw`((?:\s*<div class="option" onclick="${fn}\(this,\s*[123]\)">[\s\S]*?<\/div>\s*){3})`);
    const block = html.match(blockRe);
    if(!block) continue;
    const itemRe = new RegExp(String.raw`<div class="option" onclick="${fn}\(this,\s*([123])\)">([\s\S]*?)<\/div>`,'g');
    const items = {}; let m;
    while((m=itemRe.exec(block[1]))!==null) items[Number(m[1])] = m[2];
    if(!items[1]||!items[2]||!items[3]) continue;
    const correct = items[cur];
    const wrongs = [1,2,3].filter(n=>n!==cur).map(n=>items[n]);
    const ordered = wrongs.slice(); ordered.splice(desired-1,0,correct);
    let nb='\n';
    ordered.forEach((txt,i)=>{ const pos=i+1; nb += '    <div class="option" onclick="'+fn+'(this,'+pos+')">'+circ[pos]+' '+cleanOptionText(txt)+'</div>\n'; });
    html = html.replace(blockRe, nb);
    html = replaceCorrect(html, fn, desired);
  }
  return html;
}

function caseErrorHtml(code){
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:#f8efe7;color:#4b3026;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #e1cfc2;border-radius:18px;padding:28px 24px;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.btn{display:inline-block;margin-top:14px;padding:10px 14px;border-radius:999px;border:none;background:#7a5234;color:#fff;font-weight:800;cursor:pointer}</style></head><body><div class="box"><div style="font-weight:900;font-size:18px">CASE ${code} 불러오기 실패</div><div style="margin-top:8px;line-height:1.6">사건 파일을 읽지 못했습니다. 파일 압축을 모두 푼 뒤 <b>index.html</b>로 실행했는지 확인해 주세요.</div><button class="btn" onclick="location.reload()">다시 시도</button></div></body></html>`;
}

function setCaseFrameFromCode(code){
  const c=CASES.find(x=>x.code===code);
  const b64=CASE_HTML[code];
  if(!c || !b64){
    document.getElementById("caseFrame").srcdoc=caseErrorHtml(code);
    return;
  }
  const balanced = rebalanceCaseHtml(code, decodeBase64Utf8(b64));
  document.getElementById("caseFrame").srcdoc=patchCaseForPacing(balanced, code);
}

function loadCaseData(code, done){
  if(CASE_HTML[code]){ done(); return; }
  if(CASE_LOAD_STATE[code] === 'loading'){
    const timer = setInterval(()=>{
      if(CASE_HTML[code]){ clearInterval(timer); done(); }
      else if(CASE_LOAD_STATE[code] === 'error'){ clearInterval(timer); }
    }, 80);
    return;
  }
  const src = CASE_DATA_FILES[code];
  if(!src){ done(); return; }
  CASE_LOAD_STATE[code] = 'loading';
  const s = document.createElement('script');
  s.src = src;
  s.async = true;
  s.onload = ()=>{ CASE_LOAD_STATE[code] = 'loaded'; done(); };
  s.onerror = ()=>{
    CASE_LOAD_STATE[code] = 'error';
    toast('사건 파일을 불러오지 못했습니다. 압축을 모두 푼 뒤 실행해 주세요.');
    if(activeCaseCode===code) document.getElementById('caseFrame').srcdoc = caseErrorHtml(code);
  };
  document.head.appendChild(s);
}

function openCase(code){
  const c=CASES.find(x=>x.code===code);if(!c)return;
  activeCaseCode=code;
  try{localStorage.setItem("history_detective_last_case",code)}catch(e){}
  document.getElementById("viewerTitle").textContent=`CASE ${code} · ${c.title}`;
  updateViewerBackLabel();
  document.getElementById("viewer").classList.add("show");
  document.body.style.overflow="hidden";
  document.getElementById("caseFrame").srcdoc=caseLoadingHtml(code,c.title);
  loadCaseData(code, ()=>{ if(activeCaseCode===code) setCaseFrameFromCode(code); });
}

function continueLast(){
  let code=null;
  try{code=localStorage.getItem("history_detective_last_case")}catch(e){}
  const c=CASES.find(x=>x.code===code);
  if(!c){toast("아직 최근 수사 기록이 없습니다.");return}
  openCase(code);
}

function closeCase(){
  document.getElementById("viewer").classList.remove("show");
  document.body.style.overflow="";
  document.getElementById("caseFrame").srcdoc="";
  updateProgress();

  if(document.getElementById("unitPage").classList.contains("show") && currentUnit){
    openUnit(currentUnit);
  } else if(document.getElementById("notebookPage").classList.contains("show")) {
    showNotebook();
  }
  activeCaseCode=null;
  updateViewerBackLabel();
}

function refreshCase(){
  if(activeCaseCode){
    const c=CASES.find(x=>x.code===activeCaseCode);
    document.getElementById("caseFrame").srcdoc=caseLoadingHtml(activeCaseCode,c?c.title:'사건');
    loadCaseData(activeCaseCode, ()=>{ if(activeCaseCode) setCaseFrameFromCode(activeCaseCode); });
  }
}
